worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    map "$status:$uri" $asset_cache {
        default "no-cache";
        "~^(200|304):/(index\\.html|build-info\\.json)?$" "no-store";
        "~^(200|304):/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" "public, max-age=31536000, immutable";
    }
    server {
        listen 8080;
        server_name _;
        root /srv/flyfork;
        autoindex off;
        add_header Cache-Control $asset_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; worker-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location = / { etag off; if_modified_since off; try_files /index.html =404; }
        location = /index.html { etag off; if_modified_since off; try_files $uri =404; }
        location = /build-info.json { etag off; if_modified_since off; try_files $uri =404; }
        location / { try_files $uri =404; }
    }
}
